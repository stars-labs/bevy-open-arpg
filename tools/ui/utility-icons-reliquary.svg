<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="256" viewBox="0 0 1024 256">
  <defs>
    <radialGradient id="stone">
      <stop stop-color="#252725"/>
      <stop offset="0.7" stop-color="#151916"/>
      <stop offset="1" stop-color="#070b0b"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#fff0bf"/>
      <stop offset="0.28" stop-color="#cba364"/>
      <stop offset="0.57" stop-color="#715132"/>
      <stop offset="0.76" stop-color="#d1a05d"/>
      <stop offset="1" stop-color="#513a25"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#ffe9b0"/>
      <stop offset="0.47" stop-color="#c8954e"/>
      <stop offset="1" stop-color="#7f512a"/>
    </linearGradient>
    <g id="medallion">
      <circle cx="128" cy="128" r="108" fill="url(#stone)" stroke="#090b0b" stroke-width="10"/>
      <circle cx="128" cy="128" r="108" fill="none" stroke="url(#bronze)" stroke-width="5"/>
      <circle cx="128" cy="128" r="96" fill="none" stroke="#6b5435" stroke-width="2"/>
      <path d="M128 10l9 16-9 13-9-13z M128 217l9 13-9 16-9-16z M10 128l16-9 13 9-13 9z M217 128l13-9 16 9-16 9z" fill="url(#bronze)" stroke="#2b2018" stroke-width="2"/>
      <path d="M55 49l10 11 M191 60l10-11 M55 207l10-11 M191 196l10 11" stroke="#a67f47" stroke-width="4"/>
    </g>
  </defs>
  <!-- Audio: an unmistakable speaker with two sound waves. -->
  <g>
    <use href="#medallion"/>
    <path d="M62 108h24l40-31v102l-40-31H62z" fill="url(#gold)" stroke="#302316" stroke-width="4"/>
    <path d="M145 100q30 28 0 56 M162 80q49 48 0 96" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <path d="M70 113h17l33-26" fill="none" stroke="#ffedc0" stroke-width="3"/>
  </g>
  <!-- Journal: leather-bound folio with a clasp and a crimson bookmark. -->
  <g transform="translate(256)">
    <use href="#medallion"/>
    <path d="M83 65h88v125H83q-15 0-15-14V80q0-15 15-15z" fill="#33271e" stroke="url(#bronze)" stroke-width="6"/>
    <path d="M84 66v111 M84 177h88 M84 184h87" fill="none" stroke="#ad8855" stroke-width="3"/>
    <path d="M137 68v44l-10-7-10 7V68" fill="#8f2d20" stroke="#c26038" stroke-width="2"/>
    <path d="M98 126h41 M98 139h33 M98 153h40" stroke="url(#gold)" stroke-width="4"/>
    <path d="M157 116h19v25h-19z" fill="url(#gold)" stroke="#302316" stroke-width="3"/>
    <circle cx="166" cy="128" r="3" fill="#241910"/>
  </g>
  <!-- Gold: stacked coins and a front-facing stamped coin. -->
  <g transform="translate(512)">
    <use href="#medallion"/>
    <g fill="url(#gold)" stroke="#4b311c" stroke-width="4">
      <path d="M68 143v29c0 17 91 17 91 0v-29z"/>
      <ellipse cx="113.5" cy="143" rx="45.5" ry="16"/>
      <path d="M69 159c18 15 70 15 89 0" fill="none"/>
      <circle cx="144" cy="109" r="40"/>
      <circle cx="144" cy="109" r="30" fill="none" stroke="#edca80" stroke-width="3"/>
      <path d="M144 88l13 21-13 21-13-21z" fill="#805329" stroke="#ffe2a0" stroke-width="2"/>
    </g>
  </g>
  <!-- Defeat / threat: angular bone skull, readable at HUD sizes. -->
  <g transform="translate(768)">
    <use href="#medallion"/>
    <path d="M128 65c-41 0-58 26-55 63l8 22 16 7 4 24h54l4-24 16-7 8-22c3-37-14-63-55-63z" fill="url(#gold)" stroke="#39291d" stroke-width="5"/>
    <path d="M88 111l31 9-7 24-23-9z M168 111l-31 9 7 24 23-9z M128 139l-9 18h18z" fill="#161411"/>
    <path d="M113 168v14 M128 165v17 M143 168v14" stroke="#39291d" stroke-width="5"/>
    <path d="M87 96q13-22 41-23" fill="none" stroke="#ffe7b0" stroke-width="4"/>
  </g>
</svg>
