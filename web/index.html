<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open ARPG</title>
  <meta name="theme-color" content="#140806">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Open ARPG">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./pwa.css">
  <link rel="stylesheet" href="./game-cache.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <canvas id="bevy-canvas"></canvas>
  <main id="loading">
    <nav id="language-switch" aria-label="Language"><button data-language="en">EN</button><button data-language="zh-CN">简中</button></nav>
    <img class="rune" src="./icons/icon-192.png" width="96" height="96" alt="">
    <h1>OPEN ARPG</h1>
    <p id="intro"></p>
    <p id="status" role="status"></p>
    <button id="start" type="button"></button>
    <section id="cache-card"><p id="cache-status" role="status"></p><progress id="cache-progress" hidden></progress><div id="cache-actions"><button id="cache-update" hidden></button><button id="cache-later" hidden></button></div></section>
    <section id="install-card" hidden><p id="install-summary"></p><button id="install-button" class="install-action"><span id="install-label"></span></button></section>
  </main>
  <dialog id="install-dialog" aria-labelledby="install-title"><h2 id="install-title"></h2><ol id="install-steps"></ol><p id="install-note"></p><button id="install-close" class="install-action"></button></dialog>
  <script type="module">
    import {boot} from './launcher.js';
    const buildId = "f2c3af6019db1489";
    boot(buildId);
  </script>
</body>
</html>
