name: Build, Release, and Deploy WebGPU

# Flow: build the wasm bundle -> publish it as a GitHub Release asset ->
# deploy to GitHub Pages FROM that release asset. Pages therefore always serves
# exactly what was released, and every deploy has a downloadable, versioned record.
#
# Triggers:
#   - push to main         -> rolling "web-latest" prerelease + deploy to Pages
#   - push tag v*          -> versioned web + native release bundles + deploy to Pages
#   - workflow_dispatch    -> explicit tag release (release_type=tag + release_tag=v*)
#                            or web-latest preview (release_type=preview)
#   - pull_request         -> build only (no release, no deploy)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Optional ref for preview release checkout (defaults to the current branch/ref)."
        required: false
        default: ""
      release_tag:
        description: "Manual run tag when release_type=tag (must start with v)"
        required: false
        default: ""
      release_type:
        description: "Whether this run is a preview or a tagged release"
        required: false
        type: choice
        options:
          - preview
          - tag
        default: preview

concurrency:
  group: bevy-open-arpg-pages-${{ github.repository }}-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: bevy-open-arpg

jobs:
  build-web:
    name: Build WebAssembly package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'tag' && github.event.inputs.release_tag || (github.event.inputs.checkout_ref != '' && github.event.inputs.checkout_ref) || github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-targets: true
          cache-on-failure: false

      - name: Cache wasm tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-opt
          key: ${{ runner.os }}-wasm-tools-${{ hashFiles('scripts/build_web.sh', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-tools-

      # The fat-LTO release link peaks past the runner's RAM — without swap
      # the VM gets OOM-terminated mid-link (SIGTERM/exit 143).
      - name: Add swap for the fat-LTO link
        run: |
          sudo fallocate -l 12G /mnt/extra-swap
          sudo chmod 600 /mnt/extra-swap
          sudo mkswap /mnt/extra-swap
          sudo swapon /mnt/extra-swap
          free -h

      - name: Build web artifacts
        # build_web.sh pins the wasm-bindgen CLI to the Cargo.lock version and
        # downloads binaryen itself, so no extra tool install is needed.
        run: bash scripts/build_web.sh

      - name: Package web bundle
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (cd web && zip -r -q ../artifacts/web-dist.zip .)
          (
            cd artifacts
            sha256sum web-dist.zip > web-dist.zip.sha256
            sha256sum -c web-dist.zip.sha256
          )
          ls -la artifacts/web-dist.zip
          sha256sum artifacts/web-dist.zip

      - name: Build web release manifest
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          web_hash="$(cut -d' ' -f1 artifacts/web-dist.zip.sha256)"
          web_size="$(stat -c %s artifacts/web-dist.zip)"
          web_sha_hash="$(sha256sum artifacts/web-dist.zip.sha256 | awk '{print $1}')"
          web_sha_size="$(stat -c %s artifacts/web-dist.zip.sha256)"
          {
            echo "field,value"
            printf 'source_commit,%s\n' "$SOURCE_SHA"
            printf 'web_dist_sha256,%s\n' "$web_hash"
            printf 'web_dist_size_bytes,%s\n' "$web_size"
            printf 'web_dist_checksum_sha256,%s\n' "$web_sha_hash"
            printf 'web_dist_checksum_size_bytes,%s\n' "$web_sha_size"
          } > artifacts/web-release-manifest.csv

      - name: Upload web bundle (passes the build between jobs)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist-${{ github.sha }}
          path: |
            artifacts/web-dist.zip
            artifacts/web-dist.zip.sha256
            artifacts/web-release-manifest.csv
          if-no-files-found: error
          retention-days: 7

  build-native:
    name: Build native release bundles
    # Native artifacts are only packaged on tagged or explicit tag-release dispatches.
    # This keeps main-branch preview runs lightweight.
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.release_type == 'tag' &&
        github.event.inputs.release_tag != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary_ext: ""
            package_type: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary_ext: ".exe"
            package_type: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary_ext: ""
            package_type: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'tag' && github.event.inputs.release_tag || (github.event.inputs.checkout_ref != '' && github.event.inputs.checkout_ref) || github.ref }}
      RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'tag' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-targets: true
          cache-on-failure: false

      - name: Build native release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package native release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import shutil
          import tarfile
          import zipfile
          from pathlib import Path

          APP_NAME = os.environ["APP_NAME"]
          VERSION = os.environ["VERSION"]
          PLATFORM = os.environ["PLATFORM"]
          TARGET = os.environ["TARGET"]
          BINARY_EXT = os.environ["BINARY_EXT"]
          PACKAGE_TYPE = os.environ["PACKAGE_TYPE"]
          output = Path.cwd()

          binary_name = f"{APP_NAME}{BINARY_EXT}"
          binary_path = Path("target") / TARGET / "release" / binary_name
          if not binary_path.is_file():
            raise SystemExit(f"missing native binary: {binary_path}")

          artifact_name = f"{APP_NAME}-{VERSION}-{PLATFORM}.{PACKAGE_TYPE}"
          artifact_path = output / artifact_name
          sha_name = artifact_path.with_suffix(artifact_path.suffix + ".sha256")
          package_dir = Path("release-package")
          staging_dir = package_dir / f"{APP_NAME}-{PLATFORM}"
          staging_dir.mkdir(parents=True, exist_ok=True)
          staging = [binary_path, Path("README.md"), Path("Cargo.toml"), Path("LICENSE")]
          assets_path = Path("assets")

          for src in staging:
            if not src.is_file():
              raise SystemExit(f"missing staging file: {src}")
            shutil.copy2(src, staging_dir / src.name)

          if not assets_path.is_dir():
            raise SystemExit(f"missing runtime assets directory: {assets_path}")
          shutil.copytree(assets_path, staging_dir / assets_path.name)

          if PACKAGE_TYPE == "zip":
            with zipfile.ZipFile(artifact_path, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for item in sorted(path for path in staging_dir.rglob("*") if path.is_file()):
                relative = item.relative_to(staging_dir)
                zf.write(item, arcname=Path(staging_dir.name) / relative)
          elif PACKAGE_TYPE == "tar.gz":
            with tarfile.open(artifact_path, "w:gz") as tf:
              tf.add(staging_dir, arcname=staging_dir.name)
          else:
            raise SystemExit(f"Unsupported package type: {PACKAGE_TYPE}")

          hasher = hashlib.sha256()
          hasher.update(artifact_path.read_bytes())
          sha_name.write_text(f"{hasher.hexdigest()}  {artifact_path.name}\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"artifact_name={artifact_name}\n")
            out.write(f"artifact_path={artifact_path}\n")
            out.write(f"sha_path={sha_name}\n")
          PY
        env:
          APP_NAME: ${{ env.APP_NAME }}
          VERSION: ${{ env.RELEASE_TAG_NAME }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          BINARY_EXT: ${{ matrix.binary_ext }}
          PACKAGE_TYPE: ${{ matrix.package_type }}

      - name: Upload native release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bevy-open-arpg-native-${{ env.RELEASE_TAG_NAME }}-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.sha_path }}
          if-no-files-found: error
          retention-days: 7

  release-web:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-web
      - build-native
    # Keep release publishing alive for preview builds when native is intentionally skipped,
    # but still fail closed for native release requests if native builds fail.
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs['build-web'].result == 'success' &&
      (needs['build-native'].result == 'success' || needs['build-native'].result == 'skipped')
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ needs.build-web.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-web.outputs.source_sha }}
          persist-credentials: false

      - name: Determine release tag
        id: meta
        run: |
          set -euo pipefail
          write_meta() {
            {
              echo "tag=$1"
              echo "prerelease=$2"
              echo "is_tag_release=$3"
              echo "make_latest=$4"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_type="${{ github.event.inputs.release_type }}"
            release_tag="${{ github.event.inputs.release_tag }}"

            if [[ "${release_type}" == "tag" ]]; then
              if [[ "${release_tag}" != v* ]]; then
                echo "error: release_type=tag requires release_tag to start with 'v' (e.g. v0.1.0)." >&2
                exit 1
              fi
              write_meta "$release_tag" false true true
            else
              if [[ -n "${release_tag}" ]]; then
                echo "warning: release_type=preview ignores release_tag=${release_tag}." >&2
              fi
              write_meta web-latest true false false
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            write_meta "${GITHUB_REF#refs/tags/}" false true true
          else
            write_meta web-latest true false false
          fi

      - name: Validate release metadata
        if: steps.meta.outputs.is_tag_release == 'true'
        run: |
          set -euo pipefail

          if [[ ! "${{ steps.meta.outputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z (for example v0.1.0): ${{ steps.meta.outputs.tag }}" >&2
            exit 1
          fi

          crate_version=$(awk -F '"' '/^\[package\]/{in_package=1; next}
            in_package && /^[[:space:]]*version[[:space:]]*=/{print $2; exit}' Cargo.toml)

          if [ -z "$crate_version" ]; then
            echo "Unable to parse version from Cargo.toml." >&2
            exit 1
          fi

          expected_tag="v${crate_version}"
          if [ "${{ steps.meta.outputs.tag }}" != "$expected_tag" ]; then
            echo "Release tag mismatch: got '${{ steps.meta.outputs.tag }}', expected '$expected_tag' from Cargo.toml." >&2
            exit 1
          fi

      - name: Download web bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist-${{ github.sha }}
          path: .

      - name: Download native bundle on tagged release
        if: steps.meta.outputs.is_tag_release == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bevy-open-arpg-native-${{ steps.meta.outputs.tag }}-*
          path: .
          merge-multiple: true

      - name: Build release asset list
        id: assets
        run: |
          set -euo pipefail
          asset_list="release-assets.txt"
          release_body="release-body.md"
          : > "$asset_list"
          : > "$release_body"

          append() {
            if [ ! -f "$1" ]; then
              echo "error: required release asset missing: ${1}" >&2
              exit 1
            fi
            printf '%s\n' "$1" >> "$asset_list"
          }

          append "web-dist.zip"
          append "web-dist.zip.sha256"
          append "web-release-manifest.csv"
          if [[ "${{ steps.meta.outputs.is_tag_release }}" == "true" ]]; then
            shopt -s nullglob
            tag_release_artifacts=(
              "${{ env.APP_NAME }}-${{ steps.meta.outputs.tag }}"-*
            )
            shopt -u nullglob

            if (( ${#tag_release_artifacts[@]} == 0 )); then
              echo "error: no tagged release artifacts found for ${{ steps.meta.outputs.tag }}" >&2
              exit 1
            fi

            for f in "${tag_release_artifacts[@]}"; do
              append "$f"
            done
          fi

          # Emit a stable checksum/size manifest for every payload artifact.
          checksum_manifest="release-asset-manifest.csv"
          manifest_checksum="${checksum_manifest}.sha256"
          printf 'artifact,sha256,size_bytes\n' > "$checksum_manifest"
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            if [ ! -f "$asset" ]; then
              echo "error: release asset missing from workspace: ${asset}" >&2
              exit 1
            fi
            asset_sha="$(sha256sum "$asset" | awk '{print $1}')"
            asset_size="$(stat -c %s "$asset")"
            printf '%s,%s,%s\n' "$asset" "$asset_sha" "$asset_size" >> "$checksum_manifest"
          done < "$asset_list"

          sha256sum "$checksum_manifest" > "$manifest_checksum"
          append "$checksum_manifest"
          append "$manifest_checksum"

          if [[ "${{ steps.meta.outputs.is_tag_release }}" == "true" ]]; then
            required_native=(
              "${APP_NAME}-${{ steps.meta.outputs.tag }}-linux-x86_64.tar.gz"
              "${APP_NAME}-${{ steps.meta.outputs.tag }}-windows-x86_64.zip"
              "${APP_NAME}-${{ steps.meta.outputs.tag }}-macos-x86_64.tar.gz"
            )
            for native_asset in "${required_native[@]}"; do
              if [ ! -f "$native_asset" ]; then
                echo "error: required native artifact missing for tagged release: ${native_asset}" >&2
                exit 1
              fi
            done
          fi

          release_type="${{ steps.meta.outputs.is_tag_release }}"
          if [[ "$release_type" == "true" ]]; then
            release_kind="versioned release"
          else
            release_kind="web preview (rolling)"
          fi

          {
            echo "## bevy-open-arpg ${{ steps.meta.outputs.tag }}"
            echo
            echo "- commit: \`${{ needs.build-web.outputs.source_sha }}\`"
            echo "- release type: $release_kind"
            echo "- web bundle: \`web-dist.zip\`"
            echo "- checksums: \`release-asset-manifest.csv\` and detached SHA-256"
            if [[ "${{ steps.meta.outputs.is_tag_release }}" == "true" ]]; then
              echo "- native bundles: \`linux-x86_64\`, \`windows-x86_64\`, \`macos-x86_64\`"
            fi
            echo
            echo "## Release Artifacts"
            echo
            echo "| Artifact | SHA-256 | Size (bytes) |"
            echo "| --- | ---: | ---: |"

            while IFS=, read -r artifact hash size; do
              [ -n "$artifact" ] || continue
              if [[ "$artifact" == "artifact" ]]; then
                continue
              fi
              printf "| %s | %s | %s |\n" "$artifact" "$hash" "$size"
            done < "$checksum_manifest"
          } > "$release_body"

          {
            echo "files<<EOF"
            cat "$asset_list"
            echo "EOF"
            echo "body_path=$release_body"
          } >> "$GITHUB_OUTPUT"
          if [ -s "$asset_list" ]; then
            echo "Release assets:"
            cat "$asset_list"
          fi
          echo "Release checksums:"
          cat "$checksum_manifest"

      - name: Attest release artifacts
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: ${{ steps.assets.outputs.files }}

      - name: Move rolling preview tag to the built commit
        if: steps.meta.outputs.is_tag_release != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.build-web.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/web-latest" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/web-latest" \
              -f sha="$SOURCE_SHA" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/web-latest" \
              -f sha="$SOURCE_SHA" >/dev/null
          fi

      - name: Publish release with the web bundle
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: bevy-open-arpg ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          overwrite_files: true
          target_commitish: ${{ needs.build-web.outputs.source_sha }}
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
          body_path: ${{ steps.assets.outputs.body_path }}
          generate_release_notes: ${{ steps.meta.outputs.is_tag_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    name: Deploy to GitHub Pages from release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release-web
    # release-web intentionally tolerates the native job being skipped for
    # rolling web previews. Use always() here as well so that skipped
    # transitive dependency does not suppress an otherwise valid Pages deploy.
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs['release-web'].result == 'success'
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Verify Pages uses the GitHub Actions publishing source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::GitHub Pages publishing source is '$build_type'; select GitHub Actions in Settings > Pages."
            exit 1
          fi

      - name: Download released bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-web.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern web-dist.zip \
            --output web-dist.zip \
            --clobber
          mkdir -p web-dist
          unzip -q -o web-dist.zip -d web-dist
          ls -la web-dist
          # Keep the page root clean for deploy-pages.
          find web-dist -maxdepth 1 -type f \( -name '.gitkeep' -o -name '.nojekyll' \) -delete || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages bundle
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web-dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verify deployed files match the released bundle
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          SOURCE_SHA: ${{ needs.release-web.outputs.source_sha }}
        run: |
          set -euo pipefail
          page_root="${PAGE_URL%/}"
          cache_key="${SOURCE_SHA}-${GITHUB_RUN_ATTEMPT}"
          verify_files=(
            "index.html"
            "pkg/bevy_open_arpg.js"
            "pkg/bevy_open_arpg_bg.wasm.gz"
            "assets/models/hollow_matron.glb"
          )

          for attempt in $(seq 1 20); do
            matched=true
            for relative_path in "${verify_files[@]}"; do
              mkdir -p "deployed/$(dirname "$relative_path")"
              if ! curl -fsSL \
                --connect-timeout 10 \
                --max-time 60 \
                -H "Cache-Control: no-cache" \
                "${page_root}/${relative_path}?release=${cache_key}-${attempt}" \
                -o "deployed/${relative_path}"; then
                matched=false
                break
              fi

              expected="$(sha256sum "web-dist/${relative_path}" | awk '{print $1}')"
              actual="$(sha256sum "deployed/${relative_path}" | awk '{print $1}')"
              if [[ "$actual" != "$expected" ]]; then
                echo "Attempt ${attempt}: ${relative_path} is still stale (${actual} != ${expected})."
                matched=false
                break
              fi
            done

            if [[ "$matched" == "true" ]]; then
              echo "GitHub Pages matches the released web bundle at ${SOURCE_SHA}."
              exit 0
            fi

            sleep 15
          done

          echo "::error::GitHub Pages did not converge to the released bundle after 20 attempts."
          exit 1
